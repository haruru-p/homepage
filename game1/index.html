<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset = "UTF-8">
 <title>弾幕ゲーム</title>
 <style>
  body { margin: 0; overflow: hidden; width: 100vw; height: 100vh; background-color: black; color: white; }
  canvas { display: block; width: 100vw; height: 100vh; margin: 0; }
 </style>
</head>
<body>
 <canvas>JavaScriptが無効になっている可能性があります</canvas>
 <script>
  const canvas = document.querySelector('canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const createImg = path => { const i = new Image(); i.src = path; return i; };
  const player = {
   x: canvas.width / 2,
   y: canvas.height / 2,
   radius: 8,
   speed: 3
  };
  const frame = {
   x: (canvas.width - 600) / 2,
   y: (canvas.height - 400) / 2,
   width: 600, height: 400
  };
  const key = {};
  const bullet = [];
  let frameCount = 0;
  let level = 1;
  let gameover = false;
  function loop() { // ループ処理
   ctx.clearRect(0, 0, canvas.width, canvas.height);
   frameCount++

   ctx.font = '50px serif';
   ctx.fillStyle = '#ffffff';
   ctx.fillText((frameCount/6).toFixed(0), 10, 50);

   if (frameCount % (11-level) === 0){
    bullet.push({
     x: frame.x + Math.random() * frame.width,
     y: 0, radius: 4, speed: 4
    });
   }
   if (frameCount %600 === 0 && level !== 10){
    level++;
   }
   for (let i = bullet.length - 1; i >= 0; i--) {
    const e = bullet[i];
    e.y += e.speed;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#ff8888';
    ctx.fill();
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < player.radius + e.radius) { gameover = true; }
    if (e.y > canvas.height) { bullet.splice(i, 1); } 
   }
   if (gameover) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(frame.x, frame.y, frame.width, frame.height);
    ctx.fillStyle = '#ff0000';
    ctx.font = '100px serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', frame.x + frame.width / 2, frame.y + frame.height / 2);
    ctx.font = '50px serif';
    ctx.textAlign = 'center';
    ctx.fillText('Please press "R" or reload to try again', frame.x + frame.width / 2, frame.y + frame.height / 2 + 50);
    return; // ループを止める
   }
   if((key.ArrowRight || key.d) && player.x + player.radius < frame.x + frame.width){ player.x += player.speed; };
   if((key.ArrowLeft || key.a) && player.x - player.radius > frame.x){ player.x -= player.speed; };
   if((key.ArrowUp || key.w) && player.y - player.radius > frame.y){ player.y -= player.speed; };
   if((key.ArrowDown || key.s) && player.y + player.radius < frame.y + frame.height){ player.y += player.speed; };
   ctx.beginPath() // 線つながり防止(ペンを上げる→ペンを下ろす)これがないと線でつながる
   ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); // 円は中心が起点 Math.PI * 2は1周という意味 *2がないと半円
   ctx.fillStyle = '#8888ff';
   ctx.fill(); // 塗りつぶす
   ctx.beginPath();
   ctx.strokeStyle = '#ffffff';
   ctx.lineWidth = 10;
   ctx.strokeRect(frame.x, frame.y, frame.width, frame.height);
   requestAnimationFrame(loop); // 繰り返し処理
  }; // ループの終了

  function pressR(){
   if (gameover && (key.r || key.R)){
    location.reload();
   }
   requestAnimationFrame(pressR);
  };
  loop(); // 最初の実行
  pressR();

  document.addEventListener('keydown', (e)=>{ key[e.key] = true; });
  document.addEventListener('keyup', (e)=>{ key[e.key] = false; });
 </script>
</body>
</html>
