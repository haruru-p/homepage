<DOCTYPE html>
<html lang='ja'>
  <head>
    <meta charset = 'UTF-8'>
    <title>haruru-pのホームページとゲーム</title>
    <style>
      body { color: white; background-color: black; display: flex; flex-direction: column; align-items: center;　}
      #buttons { display: flex; flex-direction: column; align-items: center; }
      button { width: 700px; height: 200px; border: 3px solid white; background-color: black; transition: 0.3s; color: white; font-size: 100px; }
      button:hover { color: black; background-color: white; }
    </style>
  </head>
  <body>
    <h1>haruru-pの何もない公式ホームページ</h1>
    <div id='buttons'>
      <button id='memo'>メモ帳</button>
      <button id='game1'>ゲーム1</button>
    </div>
    <script>
      const page = {
        memo: 'memo/index.html',
        game1: 'game1/index.html'
      }
      const btn = document.querySelectorAll('button');
      btn.forEach((e, i)=>{
        e.addEventListener('click', ()=>{
          location.href = page[e.id]
        });
      });
    </script>
  </body>
</html>
